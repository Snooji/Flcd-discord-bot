name: Post daily deals

on:
  schedule:
    # Every 2 hours. GitHub runs these on UTC and may start a few minutes late.
    - cron: '0 */2 * * *'
  workflow_dispatch:

# Never let two runs overlap; they would both try to post and commit state.
concurrency:
  group: post-deals
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Check the page and post to Discord
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          # The site's Cloudflare protection returns 403 to GitHub's network, so the
          # page HTML is fetched through Jina's reader. Images download directly.
          PAGE_PROXY: jina
          JINA_API_KEY: ${{ secrets.JINA_API_KEY }}
          POST_ON_FIRST_RUN: 'true'
        run: |
          set -o pipefail
          if [ -z "$DISCORD_WEBHOOK_URL" ]; then
            echo "::error::The DISCORD_WEBHOOK_URL repository secret is empty or not set"
            exit 1
          fi
          if npm run --silent once 2>&1 | tee run.log; then
            exit 0
          fi
          # Surface the failure where it can be read without opening the log.
          echo "::error::$(grep -E '\[(ERROR|WARN)\]' run.log | tail -n 3 | tr '\n' ' ')"
          {
            echo '### Bot output'
            echo '```'
            tail -n 40 run.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit 1

      - name: Remember what was posted
        run: |
          git config user.name "flcd-discord-bot"
          git config user.email "flcd-discord-bot@users.noreply.github.com"
          git add data/state.json
          if git diff --cached --quiet; then
            echo "State unchanged; nothing to commit"
          else
            git commit -m "Update posted-deals state [skip ci]"
            git pull --rebase
            git push
          fi
